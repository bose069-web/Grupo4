server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con una variable en proxy_pass, nginx resuelve "api"
    # en cada petición: si el contenedor api se recrea (p. ej. al cambiar
    # BACKEND_URL) y cambia de IP, nginx lo sigue encontrando.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Todo lo que empiece por /api/ va a la API (mismo origen -> sin problemas de CORS)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # necesario para ver el streaming en directo
        proxy_read_timeout 300s;      # en CPU el modelo puede tardar
    }

    location /health/ {
        proxy_pass $api_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
