<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Gemma 4 · Reto Docker</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2329; --muted:#6b7480; --accent:#0b6bcb; --user:#e8f1fb; --line:#dfe3e8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#121417; --card:#1b1e22; --fg:#e6e9ec; --muted:#9aa3ad; --accent:#5aa6f0; --user:#1f2b38; --line:#2c3137; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); height:100dvh; display:flex; flex-direction:column; }
    header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--card); }
    header h1 { font-size:17px; margin:0; flex:1; }
    .badge { font-size:13px; padding:2px 10px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
    .badge.local { color:#1a7f37; border-color:#1a7f37; }
    .badge.remoto { color:#9a6700; border-color:#9a6700; }
    .badge.error { color:#cf222e; border-color:#cf222e; }
    main { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:820px; width:100%; margin:0 auto; }
    .msg { padding:10px 14px; border-radius:12px; white-space:pre-wrap; max-width:90%; }
    .msg.user { background:var(--user); align-self:flex-end; }
    .msg.ia { background:var(--card); border:1px solid var(--line); align-self:flex-start; }
    .msg.err { color:#cf222e; }
    form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--card); max-width:820px; width:100%; margin:0 auto; }
    textarea { flex:1; resize:none; font:inherit; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
    button { font:inherit; padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
  </style>
</head>
<body>
  <header>
    <h1>Chat Gemma 4</h1>
    <span id="modo" class="badge">conectando…</span>
    <span id="modelo" class="badge"></span>
  </header>
  <main id="chat"></main>
  <form id="form">
    <textarea id="input" rows="2" placeholder="Escribe un mensaje (Enter para enviar)"></textarea>
    <button id="send" type="submit">Enviar</button>
  </form>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const history = [];

  // Muestra a qué backend está conectada la API (local o remoto)
  fetch('/api/info').then(r => r.json()).then(i => {
    const m = document.getElementById('modo');
    m.textContent = i.modo === 'local' ? 'Ollama local' : 'Ollama remoto';
    m.className = 'badge ' + i.modo;
    m.title = i.backend_url;
    document.getElementById('modelo').textContent = i.modelo;
  }).catch(() => {
    const m = document.getElementById('modo');
    m.textContent = 'API no disponible'; m.className = 'badge error';
  });

  function bubble(cls, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls; d.textContent = text;
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
    return d;
  }

  async function enviar(texto) {
    history.push({ role: 'user', content: texto });
    bubble('user', texto);
    const out = bubble('ia', '…');
    send.disabled = true;
    try {
      const r = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      if (!r.ok) {
        const e = await r.json().catch(() => ({}));
        throw new Error(e.detail || ('HTTP ' + r.status));
      }
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let txt = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        txt += dec.decode(value, { stream: true });
        out.textContent = txt; chat.scrollTop = chat.scrollHeight;
      }
      history.push({ role: 'assistant', content: txt });
    } catch (e) {
      history.pop();
      out.textContent = 'Error: ' + e.message; out.classList.add('err');
    } finally {
      send.disabled = false; input.focus();
    }
  }

  document.getElementById('form').addEventListener('submit', ev => {
    ev.preventDefault();
    const t = input.value.trim();
    if (t && !send.disabled) { input.value = ''; enviar(t); }
  });
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); document.getElementById('form').requestSubmit(); }
  });
</script>
</body>
</html>
